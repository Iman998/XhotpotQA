[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "xhotpotqa"
version = "0.2.0"
description = "Reproducible construction and evaluation for the 24-language XHotpotQA benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Iman Barati", email = "iman_barati@comp.iust.ac.ir"},
  {name = "Arash Ghafouri"},
  {name = "Behrouz Minaei-Bidgoli"},
]
keywords = ["cross-lingual", "multi-hop question answering", "benchmark", "HotpotQA"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
generation = ["openai>=1.99"]
release = ["datasets>=3.6", "huggingface-hub>=0.33", "pyarrow>=18"]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
xhotpotqa = "xhotpotqa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xhotpotqa"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["xhotpotqa"]
mypy_path = "src"
explicit_package_bases = true
no_site_packages = true

[[tool.mypy.overrides]]
module = ["yaml", "openai", "huggingface_hub"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["xhotpotqa"]

[tool.coverage.report]
show_missing = true
skip_covered = true
