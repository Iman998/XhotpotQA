minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: scan the repository for committed secrets
        entry: python -m xhotpotqa.security.secret_scan .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff
        name: ruff
        entry: python -m ruff check
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
