name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static checks and package build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install --disable-pip-version-check -e ".[dev,generation,release]"
      - name: Scan for committed secrets
        run: python -m xhotpotqa.security.secret_scan .
      - name: Lint
        run: python -m ruff check .
      - name: Type-check
        run: python -m mypy
      - name: Build distributions
        run: python -m build

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install --disable-pip-version-check -e ".[dev,generation,release]"
      - name: Run tests with branch coverage
        shell: bash
        run: |
          set +e
          python -m pytest \
            --cov=xhotpotqa \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            2>&1 | tee pytest.log
          test_status=${PIPESTATUS[0]}
          if (( test_status != 0 )); then
            diagnostic=$(tail -n 80 pytest.log | tr '\r\n' '  ')
            diagnostic=${diagnostic//'%'/'%25'}
            echo "::error title=pytest failed with exit ${test_status}::${diagnostic}"
          fi
          exit "${test_status}"
      - name: Upload pytest failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-python-${{ matrix.python-version }}
          path: pytest.log
          if-no-files-found: warn
          retention-days: 7
